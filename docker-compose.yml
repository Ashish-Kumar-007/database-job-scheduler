services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
    profiles: ["tools"]
    environment: &app_environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scheduler}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-scheduler}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_RECONNECT_BASE_SECONDS: ${DB_RECONNECT_BASE_SECONDS:-0.5}
      DB_RECONNECT_MAX_SECONDS: ${DB_RECONNECT_MAX_SECONDS:-15}
      RETRY_BASE_SECONDS: ${RETRY_BASE_SECONDS:-1}
      RETRY_MAX_SECONDS: ${RETRY_MAX_SECONDS:-60}
      RETRY_JITTER_RATIO: ${RETRY_JITTER_RATIO:-0.25}
      LEASE_REAP_INTERVAL_SECONDS: ${LEASE_REAP_INTERVAL_SECONDS:-5}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  consumer:
    build:
      context: .
    restart: unless-stopped
    environment:
      <<: *app_environment
      CONSUMER_ID: ${CONSUMER_ID:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-0.5}
      CLAIM_BATCH_SIZE: ${CLAIM_BATCH_SIZE:-10}
      LEASE_SECONDS: ${LEASE_SECONDS:-30}
      SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-20}
    depends_on:
      postgres:
        condition: service_healthy

  demo:
    build:
      context: .
    profiles: ["tools"]
    environment:
      <<: *app_environment
      CONSUMER_ID: ${CONSUMER_ID:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-0.5}
      CLAIM_BATCH_SIZE: ${CLAIM_BATCH_SIZE:-10}
      LEASE_SECONDS: ${LEASE_SECONDS:-30}
      SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-20}
    command: ["python", "-m", "scripts.demo"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
