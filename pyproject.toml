[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "database-job-scheduler"
version = "0.1.0"
description = "A PostgreSQL-backed job scheduling and execution system"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
scheduler-consumer = "app.consumers.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a dedicated PostgreSQL test database",
]
